<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#003474" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>MaidLinx</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #003474;
        --fg: #ffffff;
        --muted: #b0bcc8;
        --accent: #08e0d4;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui,
          sans-serif;
      }
      main {
        box-sizing: border-box;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: calc(2rem + var(--safe-top)) 1.5rem
          calc(2rem + var(--safe-bottom));
        text-align: center;
      }
      .card {
        max-width: 22rem;
      }
      img.mark {
        width: 88px;
        height: 88px;
        border-radius: 20px;
        display: block;
        margin: 0 auto 1.25rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        line-height: 1.45;
        font-size: 0.95rem;
      }
      a.cta {
        display: inline-block;
        padding: 0.75rem 1.25rem;
        border-radius: 999px;
        background: var(--accent);
        color: #042422;
        font-weight: 600;
        text-decoration: none;
      }
      a.cta:active {
        opacity: 0.85;
      }
      .hint {
        margin-top: 1rem;
        font-size: 0.8rem;
        color: var(--muted);
      }
    </style>
    <script>
      // Production shell uses server.url → https://www.maidlinx.com.
      // This local page is the Cap webDir / offline empty state.
      (function () {
        var online = typeof navigator === "undefined" || navigator.onLine !== false;
        var isNative =
          typeof window !== "undefined" &&
          window.Capacitor &&
          typeof window.Capacitor.isNativePlatform === "function" &&
          window.Capacitor.isNativePlatform();
        if (!isNative && online) {
          window.location.replace("https://www.maidlinx.com/");
        }
      })();
    </script>
  </head>
  <body>
    <main>
      <div class="card">
        <img
          class="mark"
          src="assets/icon-512.png"
          width="88"
          height="88"
          alt="MaidLinx"
        />
        <h1>You’re offline</h1>
        <p>
          MaidLinx needs a connection to load bookings and your account. Check
          Wi‑Fi or cellular, then try again.
        </p>
        <a class="cta" href="https://www.maidlinx.com/">Retry</a>
        <p class="hint">Deep links: maidlinx://</p>
      </div>
    </main>
  </body>
</html>
